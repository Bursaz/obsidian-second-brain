name: Avenox V3 integration

on:
  push:
    branches: [main]
    paths:
      - "integrations/avenox-v3/**"
      - "scripts/install_avenox_v3.py"
      - "hooks/load_vault_context.py"
      - "tests/test_avenox_v3_integration.py"
      - ".github/workflows/avenox-v3.yml"
  pull_request:
    paths:
      - "integrations/avenox-v3/**"
      - "scripts/install_avenox_v3.py"
      - "hooks/load_vault_context.py"
      - "tests/test_avenox_v3_integration.py"
      - ".github/workflows/avenox-v3.yml"

permissions:
  contents: read

jobs:
  avenox-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: integrations/avenox-v3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run complete Avenox V3 contract suite
        env:
          BEYIN_V3_NO_SPAWN: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "v3_*test.py"
      - name: Run frozen retrieval benchmark
        run: python scripts/evaluate_v3.py
